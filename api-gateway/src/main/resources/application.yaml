spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**
            - id: category-service
              uri: lb://category-service
              predicates:
                - Path=/api/v1/categories/**

server:
  port: 8080

jwt:
  secret-key: daylachuoimahoabimatrikkei0987654321dacbietracroi

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}